<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  html, body {
    background: #000;
    color: #e6edf3;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #iptv-video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
    z-index: 1;
  }
  #iptv-video.ratio-4-3  { padding: 0 12%; }
  #iptv-video.ratio-zoom { object-fit: cover; }
  #iptv-video.ratio-fill { object-fit: fill; }

  .zap-overlay {
    position: absolute;
    top: 30px;
    left: 30px;
    background: rgba(0, 0, 0, 0.75);
    padding: 16px 24px;
    border-radius: 10px;
    border-left: 5px solid #58a6ff;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
    max-width: 60%;
  }
  .zap-overlay.show { opacity: 1; }
  .zap-overlay .zap-name { font-size: 26px; font-weight: bold; color: #fff; }
  .zap-overlay .zap-group { font-size: 15px; color: #8b949e; margin-top: 4px; }
  .zap-overlay .zap-epg { font-size: 16px; color: #c9d1d9; margin-top: 8px; }

  .logo-overlay {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 180px;
    height: 180px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
    border: 1px solid rgba(88, 166, 255, 0.3);
  }
  .logo-overlay.show { opacity: 1; }
  .logo-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logo-overlay .fallback {
    font-size: 56px;
    font-weight: bold;
    color: #58a6ff;
  }

  .control-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 30px;
    background: linear-gradient(transparent, rgba(0,0,0,0.95));
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 15;
    opacity: 1;
    transition: opacity 0.3s;
  }
  .control-bar.hidden { opacity: 0; pointer-events: none; }

  .control-bar button {
    background: rgba(30, 30, 30, 0.9);
    border: 2px solid #30363d;
    color: #fff;
    padding: 14px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
    white-space: nowrap;
    min-height: 55px;
  }
  .control-bar button:hover,
  .control-bar button:focus {
    background: #1f6feb;
    border-color: #58a6ff;
    outline: none;
    transform: scale(1.05);
  }
  .control-bar button.active {
    background: #d29922;
    border-color: #d29922;
  }
  .control-bar .title {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    margin-left: auto;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .channels-overlay {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 90vw;
    background: rgba(15, 20, 28, 0.96);
    border-left: 2px solid #30363d;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    z-index: 30;
  }
  .channels-overlay.open { transform: translateX(0); }

  .channels-header {
    padding: 18px 22px;
    border-bottom: 2px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .channels-header h3 {
    font-size: 18px;
    color: #58a6ff;
    letter-spacing: 1px;
  }
  .channels-header .close-btn {
    background: #30363d;
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    font-size: 22px;
    cursor: pointer;
  }
  .channels-header .close-btn:hover { background: #da3633; }

  .channels-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .channels-list::-webkit-scrollbar { width: 8px; }
  .channels-list::-webkit-scrollbar-thumb { background: #58a6ff; border-radius: 4px; }

  .channel-card {
    display: flex;
    gap: 14px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    align-items: center;
    background: rgba(30, 30, 30, 0.6);
    border: 2px solid transparent;
    transition: 0.15s;
  }
  .channel-card:hover,
  .channel-card:focus {
    background: #1f6feb;
    border-color: #58a6ff;
    outline: none;
  }
  .channel-card.active {
    background: rgba(31, 111, 235, 0.5);
    border-color: #1f6feb;
  }

  .channel-logo {
    width: 55px;
    height: 55px;
    background: #21262d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #58a6ff;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .channel-logo img { width: 100%; height: 100%; object-fit: contain; }

  .channel-info { flex: 1; overflow: hidden; }
  .channel-info .name {
    font-size: 16px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: bold;
  }
  .channel-info .program {
    font-size: 13px;
    color: #8b949e;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #loading-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: #58a6ff;
  }
  #loading-screen.hidden { display: none; }
  #loading-screen .spinner {
    width: 60px;
    height: 60px;
    border: 5px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-screen p { font-size: 18px; text-align: center; padding: 0 30px; line-height: 1.6; }

  #start-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0d1117, #1f2937);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 90;
    text-align: center;
    padding: 40px;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 {
    font-size: 42px;
    color: #58a6ff;
    margin-bottom: 20px;
  }
  #start-screen p {
    font-size: 18px;
    color: #8b949e;
    margin-bottom: 40px;
    max-width: 600px;
    line-height: 1.6;
  }
  #start-screen .start-btn {
    background: #1f6feb;
    color: #fff;
    border: 3px solid #58a6ff;
    padding: 22px 60px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  #start-screen .start-btn:hover,
  #start-screen .start-btn:focus {
    background: #388bfd;
    transform: scale(1.08);
    outline: none;
  }
  #start-screen .error {
    margin-top: 25px;
    color: #ff7b72;
    font-size: 14px;
    max-width: 600px;
    word-break: break-word;
    background: rgba(255, 123, 114, 0.1);
    border: 1px solid rgba(255, 123, 114, 0.4);
    padding: 15px;
    border-radius: 8px;
    display: none;
  }
  #start-screen .error.show { display: block; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>📺 IPTV Player</h1>
  <p>Drücke <strong>OK</strong> oder klicke auf START, um den Player zu starten.</p>
  <button class="start-btn" id="start-btn" type="button">▶ START</button>
  <div class="error" id="error-box"></div>
</div>

<div id="loading-screen" class="hidden">
  <div class="spinner"></div>
  <p id="loading-text">Lade Playlist...</p>
</div>

<video id="iptv-video" playsinline autoplay></video>

<div class="zap-overlay" id="zap-overlay">
  <div class="zap-name" id="zap-name"></div>
  <div class="zap-group" id="zap-group"></div>
  <div class="zap-epg" id="zap-epg"></div>
</div>

<div class="logo-overlay" id="logo-overlay">
  <img id="logo-img" src="" alt="" style="display:none;">
  <div class="fallback" id="logo-fallback" style="display:none;"></div>
</div>

<aside class="channels-overlay" id="channels-overlay">
  <div class="channels-header">
    <h3 id="channels-title">Sender</h3>
    <button class="close-btn" type="button" onclick="closeChannels()">✕</button>
  </div>
  <div class="channels-list" id="channels-list"></div>
</aside>

<div class="control-bar" id="control-bar">
  <button type="button" onclick="openChannels()">📋 Senderliste</button>
  <button type="button" onclick="prevChannel()">⏮ Zurück</button>
  <button type="button" onclick="nextChannel()">⏭ Weiter</button>
  <button type="button" id="fav-btn" onclick="toggleFavorite()">⭐ Favorit</button>
  <button type="button" id="ratio-btn" onclick="cycleRatio()">🔲 16:9</button>
  <button type="button" onclick="toggleFullscreen()">⛶ Vollbild</button>
  <span class="title" id="status-title"></span>
</div>

<script>
// ============================================================
// M3U PLAYLIST URL
// ============================================================
const M3U_URL = 'https://files.catbox.moe/oslbyl.m3u';

// ============================================================
// STATE
// ============================================================
var allChannels = [];
var currentChannel = null;
var currentIndex = -1;
var hls = null;
var favorites = [];
try { favorites = JSON.parse(localStorage.getItem('iptv_favorites') || '[]'); } catch(e) {}
var zapTimer = null;
var logoTimer = null;
var barTimer = null;
var currentRatio = 0;

var RATIOS = [
  { key: '', label: '🔲 16:9' },
  { key: 'ratio-4-3', label: '📺 4:3' },
  { key: 'ratio-zoom', label: '🔍 Zoom' },
  { key: 'ratio-fill', label: '🖼 Fill' }
];

var video = document.getElementById('iptv-video');

// ============================================================
// M3U PARSER
// ============================================================
function parseM3U(text) {
  var lines = text.split('\n');
  var channels = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      var info = line.substring(8);
      var commaIdx = info.lastIndexOf(',');
      var attrs = commaIdx > -1 ? info.substring(0, commaIdx) : info;
      var name = commaIdx > -1 ? info.substring(commaIdx + 1).trim() : 'Unbekannt';
      var logoMatch = attrs.match(/tvg-logo="([^"]*)"/);
      var groupMatch = attrs.match(/group-title="([^"]*)"/);
      current = {
        name: name || 'Unbenannt',
        logo: logoMatch ? logoMatch[1] : '',
        group: groupMatch ? groupMatch[1] : 'Andere',
        url: ''
      };
    } else if (line.startsWith('http') || line.startsWith('rtmp') || line.startsWith('rtsp')) {
      if (current) {
        current.url = line;
        channels.push(current);
        current = null;
      }
    }
  }
  return channels;
}

// ============================================================
// STREAM PLAYER
// ============================================================
function playStream(url) {
  if (!url) return;
  if (hls) { try { hls.destroy(); } catch(e) {} hls = null; }
  video.removeAttribute('src');
  video.load();

  var isHls = url.indexOf('.m3u8') > -1;

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(function(e) {
        console.warn('Autoplay blockiert:', e);
        showZapMessage('▶ Bitte Play drücken');
      });
    });
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        console.error('HLS Fehler:', data);
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else {
          showZapMessage('⚠ Stream nicht verfügbar');
          try { hls.destroy(); } catch(e) {}
          hls = null;
          setTimeout(function() { nextChannel(); }, 2000);
        }
      }
    });
  } else {
    video.src = url;
    video.play().catch(function(e) { console.warn(e); });
    video.onerror = function() {
      showZapMessage('⚠ Stream nicht verfügbar');
      setTimeout(function() { nextChannel(); }, 2000);
    };
  }
}

// ============================================================
// SENDER WÄHLEN
// ============================================================
function selectChannel(ch, idx) {
  if (!ch) return;
  currentChannel = ch;
  currentIndex = (idx !== undefined) ? idx : allChannels.indexOf(ch);

  showZapOverlay(ch);
  showLogoOverlay(ch);
  playStream(ch.url);

  var favBtn = document.getElementById('fav-btn');
  if (favBtn) favBtn.classList.toggle('active', favorites.indexOf(ch.url) > -1);

  var titleEl = document.getElementById('status-title');
  if (titleEl) titleEl.textContent = ch.name;

  var cards = document.querySelectorAll('.channel-card');
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.toggle('active', i === currentIndex);
  }

  closeChannels();
}

function nextChannel() {
  if (allChannels.length === 0) return;
  var next = (currentIndex + 1) % allChannels.length;
  selectChannel(allChannels[next], next);
}

function prevChannel() {
  if (allChannels.length === 0) return;
  var prev = (currentIndex - 1 + allChannels.length) % allChannels.length;
  selectChannel(allChannels[prev], prev);
}

// ============================================================
// OVERLAYS
// ============================================================
function showZapOverlay(ch) {
  document.getElementById('zap-name').textContent = ch.name;
  document.getElementById('zap-group').textContent = ch.group;
  document.getElementById('zap-epg').textContent = 'Jetzt: Live-Programm';
  var el = document.getElementById('zap-overlay');
  el.classList.add('show');
  clearTimeout(zapTimer);
  zapTimer = setTimeout(function() { el.classList.remove('show'); }, 5000);
}

function showLogoOverlay(ch) {
  var overlay = document.getElementById('logo-overlay');
  var img = document.getElementById('logo-img');
  var fb = document.getElementById('logo-fallback');

  if (ch.logo) {
    img.src = ch.logo;
    img.style.display = 'block';
    fb.style.display = 'none';
    img.onerror = function() {
      img.style.display = 'none';
      fb.textContent = ch.name.substring(0, 3).toUpperCase();
      fb.style.display = 'block';
    };
  } else {
    img.style.display = 'none';
    fb.textContent = ch.name.substring(0, 3).toUpperCase();
    fb.style.display = 'block';
  }
  overlay.classList.add('show');
  clearTimeout(logoTimer);
  logoTimer = setTimeout(function() { overlay.classList.remove('show'); }, 5000);
}

function showZapMessage(msg) {
  document.getElementById('zap-name').textContent = msg;
  document.getElementById('zap-group').textContent = '';
  document.getElementById('zap-epg').textContent = '';
  var el = document.getElementById('zap-overlay');
  el.classList.add('show');
  clearTimeout(zapTimer);
  zapTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ============================================================
// SENDERLISTE
// ============================================================
function renderChannels() {
  var list = document.getElementById('channels-list');
  list.innerHTML = '';
  document.getElementById('channels-title').textContent = 'Sender (' + allChannels.length + ')';

  for (var i = 0; i < allChannels.length; i++) {
    (function(index) {
      var ch = allChannels[index];
      var card = document.createElement('div');
      card.className = 'channel-card';
      card.tabIndex = 0;
      var initials = ch.name.substring(0, 2).toUpperCase();
      var logoHtml = ch.logo
        ? '<img src="' + ch.logo + '" alt="" onerror="this.parentElement.textContent=\'' + initials + '\'">'
        : initials;
      card.innerHTML =
        '<div class="channel-logo">' + logoHtml + '</div>' +
        '<div class="channel-info">' +
          '<div class="name">' + escapeHtml(ch.name) + '</div>' +
          '<div class="program">' + escapeHtml(ch.group) + '</div>' +
        '</div>';
      card.addEventListener('click', function() { selectChannel(ch, index); });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') selectChannel(ch, index);
      });
      list.appendChild(card);
    })(i);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function openChannels() {
  document.getElementById('channels-overlay').classList.add('open');
}
function closeChannels() {
  document.getElementById('channels-overlay').classList.remove('open');
}

// ============================================================
// FAVORITEN
// ============================================================
function toggleFavorite() {
  if (!currentChannel) return;
  var url = currentChannel.url;
  var idx = favorites.indexOf(url);
  if (idx > -1) favorites.splice(idx, 1);
  else favorites.push(url);
  try { localStorage.setItem('iptv_favorites', JSON.stringify(favorites)); } catch(e) {}
  document.getElementById('fav-btn').classList.toggle('active', favorites.indexOf(url) > -1);
  showZapMessage(favorites.indexOf(url) > -1 ? '⭐ Zu Favoriten hinzugefügt' : 'Aus Favoriten entfernt');
}

// ============================================================
// SEITENVERHÄLTNIS
// ============================================================
function cycleRatio() {
  currentRatio = (currentRatio + 1) % RATIOS.length;
  var r = RATIOS[currentRatio];
  video.className = r.key;
  document.getElementById('ratio-btn').textContent = r.label;
  showZapMessage('Seitenverhältnis: ' + r.label.replace(/[🔲📺🔍🖼] /, ''));
}

// ============================================================
// VOLLBILD
// ============================================================
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) fn.call(el).catch(function() {});
  } else {
    var fn2 = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn2) fn2.call(document);
  }
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', function(e) {
  switch (e.key) {
    case 'ArrowRight': nextChannel(); break;
    case 'ArrowLeft':  prevChannel(); break;
    case 'Escape':     closeChannels(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'a': case 'A': cycleRatio(); break;
    case 'c': case 'C': openChannels(); break;
  }
});

document.addEventListener('mousemove', function() {
  var bar = document.getElementById('control-bar');
  bar.classList.remove('hidden');
  clearTimeout(barTimer);
  barTimer = setTimeout(function() { bar.classList.add('hidden'); }, 5000);
});

// ============================================================
// PLAYLIST LADEN (mit CORS-Fallback)
// ============================================================
function fetchPlaylist(url) {
  return fetch(url, { mode: 'cors' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .catch(function(err) {
      console.warn('Direkter Fetch fehlgeschlagen:', err.message);
      var proxy = 'https://corsproxy.io/?' + encodeURIComponent(url);
      return fetch(proxy).then(function(res) {
        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
        return res.text();
      });
    })
    .catch(function(err) {
      console.warn('Proxy 1 fehlgeschlagen:', err.message);
      var proxy2 = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
      return fetch(proxy2).then(function(res) {
        if (!res.ok) throw new Error('Proxy 2 HTTP ' + res.status);
        return res.text();
      });
    });
}

// ============================================================
// START
// ============================================================
function showError(msg) {
  var box = document.getElementById('error-box');
  box.textContent = msg;
  box.classList.add('show');
  console.error(msg);
}

function startPlayer() {
  console.log('▶ START geklickt');

  // Fullscreen versuchen (nicht blockierend)
  try {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) fn.call(el).catch(function(e) { console.log('Fullscreen nicht möglich:', e); });
  } catch(e) { console.log('Fullscreen-Fehler:', e); }

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('error-box').classList.remove('show');
  document.getElementById('loading-screen').classList.remove('hidden');
  document.getElementById('loading-text').textContent = 'Lade Playlist...';

  console.log('Lade M3U von:', M3U_URL);

  fetchPlaylist(M3U_URL)
    .then(function(text) {
      console.log('Playlist empfangen, Länge:', text.length);
      allChannels = parseM3U(text);
      console.log('✅ ' + allChannels.length + ' Sender geparst');

      if (allChannels.length === 0) {
        throw new Error('Playlist enthält keine Sender. Prüfe das Format (muss mit #EXTM3U beginnen).');
      }

      renderChannels();
      document.getElementById('loading-screen').classList.add('hidden');
      selectChannel(allChannels[0], 0);

      barTimer = setTimeout(function() {
        document.getElementById('control-bar').classList.add('hidden');
      }, 5000);
    })
    .catch(function(err) {
      console.error('Playlist-Fehler:', err);
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      showError('❌ Playlist konnte nicht geladen werden: ' + err.message);
    });
}

// Event-Handler registrieren (mehrere Wege für TV-Kompatibilität)
var startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', startPlayer);
startBtn.addEventListener('touchend', function(e) { e.preventDefault(); startPlayer(); });

// Enter auf Start-Button
startBtn.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) startPlayer();
});

// Globaler Fallback: Enter/OK irgendwo auf dem Start-Screen
document.addEventListener('keydown', function(e) {
  var startScreen = document.getElementById('start-screen');
  if (startScreen.classList.contains('hidden')) return;
  if (e.key === 'Enter' || e.keyCode === 13) startPlayer();
});
