<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  html, body {
    background: #000;
    color: #e6edf3;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #iptv-video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
    z-index: 1;
  }
  #iptv-video.ratio-4-3  { padding: 0 12%; }
  #iptv-video.ratio-zoom { object-fit: cover; }
  #iptv-video.ratio-fill { object-fit: fill; }

  .zap-overlay {
    position: absolute;
    top: 30px;
    left: 30px;
    background: rgba(0, 0, 0, 0.75);
    padding: 16px 24px;
    border-radius: 10px;
    border-left: 5px solid #58a6ff;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
    max-width: 60%;
  }
  .zap-overlay.show { opacity: 1; }
  .zap-overlay .zap-name { font-size: 26px; font-weight: bold; color: #fff; }
  .zap-overlay .zap-group { font-size: 15px; color: #8b949e; margin-top: 4px; }
  .zap-overlay .zap-epg { font-size: 16px; color: #c9d1d9; margin-top: 8px; }

  .logo-overlay {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 180px;
    height: 180px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
    border: 1px solid rgba(88, 166, 255, 0.3);
  }
  .logo-overlay.show { opacity: 1; }
  .logo-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logo-overlay .fallback {
    font-size: 56px;
    font-weight: bold;
    color: #58a6ff;
  }

  .control-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 30px;
    background: linear-gradient(transparent, rgba(0,0,0,0.95));
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 15;
    opacity: 1;
    transition: opacity 0.3s;
  }
  .control-bar.hidden { opacity: 0; pointer-events: none; }

  .control-bar button {
    background: rgba(30, 30, 30, 0.9);
    border: 2px solid #30363d;
    color: #fff;
    padding: 14px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
    white-space: nowrap;
    min-height: 55px;
  }
  .control-bar button:hover,
  .control-bar button:focus {
    background: #1f6feb;
    border-color: #58a6ff;
    outline: none;
    transform: scale(1.05);
  }
  .control-bar button.active {
    background: #d29922;
    border-color: #d29922;
  }
  .control-bar .title {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    margin-left: auto;
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .channels-overlay {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 90vw;
    background: rgba(15, 20, 28, 0.96);
    border-left: 2px solid #30363d;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    z-index: 30;
  }
  .channels-overlay.open { transform: translateX(0); }

  .channels-header {
    padding: 18px 22px;
    border-bottom: 2px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .channels-header h3 {
    font-size: 18px;
    color: #58a6ff;
    letter-spacing: 1px;
  }
  .channels-header .close-btn {
    background: #30363d;
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    font-size: 22px;
    cursor: pointer;
  }
  .channels-header .close-btn:hover { background: #da3633; }

  .channels-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .channels-list::-webkit-scrollbar { width: 8px; }
  .channels-list::-webkit-scrollbar-thumb { background: #58a6ff; border-radius: 4px; }

  .channel-card {
    display: flex;
    gap: 14px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    align-items: center;
    background: rgba(30, 30, 30, 0.6);
    border: 2px solid transparent;
    transition: 0.15s;
  }
  .channel-card:hover,
  .channel-card:focus {
    background: #1f6feb;
    border-color: #58a6ff;
    outline: none;
  }
  .channel-card.active {
    background: rgba(31, 111, 235, 0.5);
    border-color: #1f6feb;
  }

  .channel-logo {
    width: 55px;
    height: 55px;
    background: #21262d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #58a6ff;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .channel-logo img { width: 100%; height: 100%; object-fit: contain; }

  .channel-info { flex: 1; overflow: hidden; }
  .channel-info .name {
    font-size: 16px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: bold;
  }
  .channel-info .program {
    font-size: 13px;
    color: #8b949e;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #loading-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: #58a6ff;
  }
  #loading-screen.hidden { display: none; }
  #loading-screen .spinner {
    width: 60px;
    height: 60px;
    border: 5px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-screen p { font-size: 18px; }

  #start-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0d1117, #1f2937);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 90;
    text-align: center;
    padding: 40px;
  }
  #start-screen.hidden { display: none; }
  #start-screen h1 {
    font-size: 42px;
    color: #58a6ff;
    margin-bottom: 20px;
  }
  #start-screen p {
    font-size: 18px;
    color: #8b949e;
    margin-bottom: 40px;
    max-width: 600px;
    line-height: 1.6;
  }
  #start-screen .start-btn {
    background: #1f6feb;
    color: #fff;
    border: 3px solid #58a6ff;
    padding: 22px 60px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  #start-screen .start-btn:hover,
  #start-screen .start-btn:focus {
    background: #388bfd;
    transform: scale(1.08);
    outline: none;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>📺 IPTV Player</h1>
  <p>Drücke <strong>OK</strong> auf der Fernbedienung, um den Player zu starten.</p>
  <button class="start-btn" id="start-btn">▶ START</button>
</div>

<div id="loading-screen" class="hidden">
  <div class="spinner"></div>
  <p id="loading-text">Lade Playlist...</p>
</div>

<video id="iptv-video" playsinline autoplay></video>

<div class="zap-overlay" id="zap-overlay">
  <div class="zap-name" id="zap-name"></div>
  <div class="zap-group" id="zap-group"></div>
  <div class="zap-epg" id="zap-epg"></div>
</div>

<div class="logo-overlay" id="logo-overlay">
  <img id="logo-img" src="" alt="" style="display:none;">
  <div class="fallback" id="logo-fallback" style="display:none;"></div>
</div>

<aside class="channels-overlay" id="channels-overlay">
  <div class="channels-header">
    <h3 id="channels-title">Sender</h3>
    <button class="close-btn" onclick="closeChannels()">✕</button>
  </div>
  <div class="channels-list" id="channels-list"></div>
</aside>

<div class="control-bar" id="control-bar">
  <button onclick="openChannels()">📋 Senderliste</button>
  <button onclick="prevChannel()">⏮ Zurück</button>
  <button onclick="nextChannel()">⏭ Weiter</button>
  <button id="fav-btn" onclick="toggleFavorite()">⭐ Favorit</button>
  <button id="ratio-btn" onclick="cycleRatio()">🔲 16:9</button>
  <button onclick="toggleFullscreen()">⛶ Vollbild</button>
  <span class="title" id="status-title"></span>
</div>

<script>
// ============================================================
// HIER IHRE EIGENE M3U PLAYLIST EINFÜGEN
// ============================================================
const M3U_PLAYLIST = `https://files.catbox.moe/oslbyl.m3u
`;
// ============================================================

let allChannels = [];
let currentChannel = null;
let currentIndex = -1;
let hls = null;
let favorites = JSON.parse(localStorage.getItem('iptv_favorites') || '[]');
let zapTimer = null;
let logoTimer = null;
let barTimer = null;
let currentRatio = 0;

const RATIOS = [
  { key: '', label: '🔲 16:9' },
  { key: 'ratio-4-3', label: '📺 4:3' },
  { key: 'ratio-zoom', label: '🔍 Zoom' },
  { key: 'ratio-fill', label: '🖼 Fill' }
];

const video = document.getElementById('iptv-video');

function parseM3U(text) {
  const lines = text.split('\n');
  const channels = [];
  let current = null;
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const info = line.substring(8);
      const commaIdx = info.lastIndexOf(',');
      const attrs = commaIdx > -1 ? info.substring(0, commaIdx) : info;
      const name = commaIdx > -1 ? info.substring(commaIdx + 1).trim() : 'Unbekannt';
      const logo = (attrs.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
      const group = (attrs.match(/group-title="([^"]*)"/) || [])[1] || 'Andere';
      current = { name: name || 'Unbenannt', logo, group, url: '' };
    } else if (line.startsWith('http') || line.startsWith('rtmp') || line.startsWith('rtsp')) {
      if (current) {
        current.url = line;
        channels.push(current);
        current = null;
      }
    }
  }
  return channels;
}

function playStream(url) {
  if (!url) return;
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src');
  video.load();

  const isHls = url.includes('.m3u8');

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(e => {
        console.warn('Autoplay blockiert:', e);
        showZapMessage('▶ Bitte Play drücken');
      });
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        console.error('HLS Fehler:', data);
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else {
          showZapMessage('⚠ Stream nicht verfügbar');
          hls.destroy(); hls = null;
          setTimeout(() => nextChannel(), 2000);
        }
      }
    });
  } else {
    video.src = url;
    video.play().catch(e => console.warn(e));
    video.onerror = () => {
      showZapMessage('⚠ Stream nicht verfügbar');
      setTimeout(() => nextChannel(), 2000);
    };
  }
}

function selectChannel(ch, idx) {
  if (!ch) return;
  currentChannel = ch;
  currentIndex = idx !== undefined ? idx : allChannels.indexOf(ch);

  showZapOverlay(ch);
  showLogoOverlay(ch);
  playStream(ch.url);

  document.getElementById('fav-btn').classList.toggle('active',
    favorites.includes(ch.url));
  document.getElementById('status-title').textContent = ch.name;

  document.querySelectorAll('.channel-card').forEach((c, i) => {
    c.classList.toggle('active', i === currentIndex);
  });

  closeChannels();
}

function nextChannel() {
  if (allChannels.length === 0) return;
  const next = (currentIndex + 1) % allChannels.length;
  selectChannel(allChannels[next], next);
}

function prevChannel() {
  if (allChannels.length === 0) return;
  const prev = (currentIndex - 1 + allChannels.length) % allChannels.length;
  selectChannel(allChannels[prev], prev);
}

function showZapOverlay(ch) {
  document.getElementById('zap-name').textContent = ch.name;
  document.getElementById('zap-group').textContent = ch.group;
  document.getElementById('zap-epg').textContent = 'Jetzt: Live-Programm';
  const el = document.getElementById('zap-overlay');
  el.classList.add('show');
  clearTimeout(zapTimer);
  zapTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

function showLogoOverlay(ch) {
  const overlay = document.getElementById('logo-overlay');
  const img = document.getElementById('logo-img');
  const fb = document.getElementById('logo-fallback');

  if (ch.logo) {
    img.src = ch.logo;
    img.style.display = 'block';
    fb.style.display = 'none';
    img.onerror = () => {
      img.style.display = 'none';
      fb.textContent = ch.name.substring(0, 3).toUpperCase();
      fb.style.display = 'block';
    };
  } else {
    img.style.display = 'none';
    fb.textContent = ch.name.substring(0, 3).toUpperCase();
    fb.style.display = 'block';
  }
  overlay.classList.add('show');
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => overlay.classList.remove('show'), 5000);
}

function showZapMessage(msg) {
  document.getElementById('zap-name').textContent = msg;
  document.getElementById('zap-group').textContent = '';
  document.getElementById('zap-epg').textContent = '';
  const el = document.getElementById('zap-overlay');
  el.classList.add('show');
  clearTimeout(zapTimer);
  zapTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function renderChannels() {
  const list = document.getElementById('channels-list');
  list.innerHTML = '';
  document.getElementById('channels-title').textContent = 'Sender (' + allChannels.length + ')';

  allChannels.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.tabIndex = 0;
    const initials = ch.name.substring(0, 2).toUpperCase();
    const logoHtml = ch.logo
      ? `<img src="${ch.logo}" alt="" onerror="this.parentElement.textContent='${initials}'">`
      : initials;
    card.innerHTML = `
      <div class="channel-logo">${logoHtml}</div>
      <div class="channel-info">
        <div class="name">${escapeHtml(ch.name)}</div>
        <div class="program">${escapeHtml(ch.group)}</div>
      </div>
    `;
    card.addEventListener('click', () => selectChannel(ch, i));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') selectChannel(ch, i);
    });
    list.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function openChannels() {
  document.getElementById('channels-overlay').classList.add('open');
}

function closeChannels() {
  document.getElementById('channels-overlay').classList.remove('open');
}

function toggleFavorite() {
  if (!currentChannel) return;
  const url = currentChannel.url;
  const idx = favorites.indexOf(url);
  if (idx > -1) favorites.splice(idx, 1);
  else favorites.push(url);
  localStorage.setItem('iptv_favorites', JSON.stringify(favorites));
  document.getElementById('fav-btn').classList.toggle('active', favorites.includes(url));
  showZapMessage(favorites.includes(url) ? '⭐ Zu Favoriten hinzugefügt' : 'Aus Favoriten entfernt');
}

function cycleRatio() {
  currentRatio = (currentRatio + 1) % RATIOS.length;
  const r = RATIOS[currentRatio];
  video.className = r.key;
  document.getElementById('ratio-btn').textContent = r.label;
  showZapMessage('Seitenverhältnis: ' + r.label.replace(/[🔲📺🔍🖼] /, ''));
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) fn.call(el).catch(() => {});
  } else {
    const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn) fn.call(document);
  }
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowRight': nextChannel(); break;
    case 'ArrowLeft':  prevChannel(); break;
    case 'Escape':     closeChannels(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'a': case 'A': cycleRatio(); break;
    case 'c': case 'C': openChannels(); break;
  }
});

document.addEventListener('mousemove', () => {
  const bar = document.getElementById('control-bar');
  bar.classList.remove('hidden');
  clearTimeout(barTimer);
  barTimer = setTimeout(() => bar.classList.add('hidden'), 5000);
});

document.getElementById('start-btn').addEventListener('click', startPlayer);

function startPlayer() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) fn.call(el).catch(() => {});

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('loading-screen').classList.remove('hidden');
  document.getElementById('loading-text').textContent = 'Lade Playlist...';

  setTimeout(() => {
    allChannels = parseM3U(M3U_PLAYLIST);
    console.log('✅ ' + allChannels.length + ' Sender geladen');

    if (allChannels.length === 0) {
      document.getElementById('loading-text').textContent = '❌ Keine Sender gefunden';
      return;
    }

    renderChannels();
    document.getElementById('loading-screen').classList.add('hidden');
    selectChannel(allChannels[0], 0);

    barTimer = setTimeout(() => {
      document.getElementById('control-bar').classList.add('hidden');
    }, 5000);
  }, 500);
}
</script>
</body>
</html>
